site_name: Kop
theme:
  name: material
  features:
    - navigation.tabs
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
repo_url: https://github.com/vegaoqiang/kop
nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Tutorial: tutorial.md
  - Guide: 
    - guide/index.md
    - guide/Clusters.md
    - guide/Nodes.md
    - guide/Pods.md
    - guide/Deployments.md
    - guide/DaemonSets.md
    - guide/StatefulSets.md
    - guide/Jobs.md
    - guide/CronJobs.md
    - guide/ConfigMaps.md
    - guide/Secrets.md
    - guide/Services.md
    - guide/Endpoints.md
    - guide/EndpointSlices.md
    - guide/Ingresses.md
    - guide/IngressClasses.md
    - guide/NetworkPolicies.md
    - guide/PersistentVolumes.md
    - guide/PersistentVolumeClaims.md
    - guide/StorageClasses.md
    - guide/Namespaces.md
    - guide/ServiceAccounts.md
    - guide/Roles.md
    - guide/RoleBindings.md
    - guide/ClusterRoles.md
    - guide/ClusterRoleBindings.md
exclude_docs: |
  readme_ch.md
  guide/zh
